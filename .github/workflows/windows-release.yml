name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build HFWeatherFax OK5TVR
        shell: cmd
        run: build_exe.bat

      - name: Create SHA-256 file
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/HFWeatherFax_OK5TVR.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  HFWeatherFax_OK5TVR.exe" | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist/SHA256SUMS.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HFWeatherFax_OK5TVR-Windows
          path: |
            dist/HFWeatherFax_OK5TVR.exe
            dist/SHA256SUMS.txt
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (gh release view $tag 2>$null) {
            gh release upload $tag "dist/HFWeatherFax_OK5TVR.exe" "dist/SHA256SUMS.txt" "THIRD_PARTY_NOTICES.md" --clobber
          } else {
            gh release create $tag "dist/HFWeatherFax_OK5TVR.exe" "dist/SHA256SUMS.txt" "THIRD_PARTY_NOTICES.md" --generate-notes --title "HFWeatherFax OK5TVR $tag"
          }
